<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1190" viewBox="0 0 1320 1190" role="img" aria-labelledby="title desc">
  <title id="title">Revised pixel-art boss fight overview</title>
  <desc id="desc">Six semi-realistic pixel-art sea-creature boss concepts based on the game's shark, crab, and other enemy sprites. The row labels match each boss to a level and competitor.</desc>
  <defs>
    <linearGradient id="page" x2="0" y2="1"><stop stop-color="#102b38"/><stop offset="1" stop-color="#06121b"/></linearGradient>
    <style>
      text { font-family: monospace; }
      .heading { fill: #f0d060; font-size: 23px; font-weight: bold; }
      .note { fill: #b5d7e0; font-size: 14px; }
      .tag { fill: #071820; fill-opacity: .92; stroke: #6db8cb; stroke-width: 2; }
      .level { fill: #d8edf2; font-size: 17px; font-weight: bold; }
      .rival { fill: #80dafa; font-size: 14px; font-weight: bold; }
    </style>
  </defs>
  <rect width="1320" height="1190" fill="url(#page)"/>
  <text x="26" y="42" class="heading">BOSS CREATURES · REVISED STYLE REVIEW</text>
  <text x="27" y="68" class="note">Sprite proposal based on the game's existing shark and sea creatures: natural anatomy, clustered pixel shading, dark outlines, restrained highlights.</text>
  <image href="boss-creatures-pixel-concept.png" x="24" y="84" width="1272" height="848" preserveAspectRatio="xMidYMid meet"/>

  <g transform="translate(38 98)"><rect class="tag" width="369" height="54" rx="3"/><text class="level" x="12" y="22">01 · SAP TERRITORY</text><text class="rival" x="12" y="43">CRAB · SAP</text></g>
  <g transform="translate(465 98)"><rect class="tag" width="369" height="54" rx="3"/><text class="level" x="12" y="22">02 · ANYPOINT STUDIO</text><text class="rival" x="12" y="43">MANTA RAY · BOOMI</text></g>
  <g transform="translate(892 98)"><rect class="tag" width="369" height="54" rx="3"/><text class="level" x="12" y="22">03 · DATAWEAVE CHASM</text><text class="rival" x="12" y="43">OCTOPUS · INFORMATICA</text></g>

  <g transform="translate(38 494)"><rect class="tag" width="369" height="54" rx="3"/><text class="level" x="12" y="22">04 · API PLATFORM</text><text class="rival" x="12" y="43">ELECTRIC EEL · KONG</text></g>
  <g transform="translate(465 494)"><rect class="tag" width="369" height="54" rx="3"/><text class="level" x="12" y="22">05 · MULE 4 ABYSS</text><text class="rival" x="12" y="43">PUFFERFISH · TIBCO</text></g>
  <g transform="translate(892 494)"><rect class="tag" width="369" height="54" rx="3"/><text class="level" x="12" y="22">06 · IPO CONTROL PLANE</text><text class="rival" x="12" y="43">SEA TURTLE · ORACLE</text></g>

  <rect x="24" y="952" width="1272" height="205" fill="#0b202b" stroke="#28556a" stroke-width="2" rx="5"/>
  <text x="43" y="984" class="heading" style="font-size:18px">SHARED FIGHT DESIGN</text>
  <text x="44" y="1016" class="note">Same swim and flap controls. T launches the squad's rockets; three visible boss hits open the existing exit gate.</text>
  <text x="44" y="1045" class="note">Each boss uses one short, clearly warned attack based on the level's familiar movement or projectile patterns.</text>
  <text x="44" y="1074" class="note">Linking every connector across all six stages unlocks the endless CRM Vesting Surge bonus with accelerating columns.</text>
  <text x="44" y="1128" fill="#f0d060" font-size="15" font-weight="bold">Approval point: creature style and level matchups before production sprites and boss implementation.</text>
</svg>
