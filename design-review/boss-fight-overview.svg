<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1010" viewBox="0 0 1320 1010" role="img" aria-labelledby="title desc">
  <title id="title">Boss fight and Vesting Surge design overview</title>
    <desc id="desc">Six pixel-art sea creature boss concepts redrawn with the game's established dark navy outlines, saturated highlights, large expressive eyes, stepped silhouettes, and limited pixel palette; competitor tags and bonus stage rules are included.</desc>
