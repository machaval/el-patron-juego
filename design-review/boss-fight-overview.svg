  <rect width="1320" height="1010" fill="url(#bg)"/>
  <text x="30" y="42" fill="#f0d060" font-size="25" font-weight="bold">BOSS FIGHTS + VESTING SURGE · DESIGN REVIEW</text>
  <text x="31" y="69" class="small">Concept overview for approval · compact pixel-art sea creatures · competitor names appear only on in-game tags (no company logos)</text>

  <!-- Six matchup cards -->
  <g transform="translate(26 92)">
    <rect class="card" width="408" height="250" rx="6"/><text x="16" y="28" class="label">01 · SAP TERRITORY</text>
    <rect x="12" y="42" width="384" height="150" class="scene"/><path d="M12 167h384v25H12z" fill="#08251f"/>
    <circle class="bubble" cx="46" cy="96" r="4"/><circle class="bubble" cx="370" cy="76" r="6"/>
    <use href="#crab" x="102" y="53" width="166" height="132"/>
    <rect class="tag" x="263" y="100" width="116" height="31" rx="3"/><text class="tagtext" x="321" y="120">SAP</text>
    <text x="16" y="218" class="small">Armored crab · broad pincer sweep</text><text x="16" y="237" class="small">Boss learns the existing cannon-lane rhythm</text>
  </g>
  <g transform="translate(456 92)">
    <rect class="card" width="408" height="250" rx="6"/><text x="16" y="28" class="label">02 · ANYPOINT STUDIO</text>
    <rect x="12" y="42" width="384" height="150" fill="#102b42"/><path d="M12 167h384v25H12z" fill="#081b2b"/>
    <circle class="bubble" cx="53" cy="80" r="5"/><circle class="bubble" cx="366" cy="145" r="4"/>
    <use href="#ray" x="102" y="53" width="166" height="132"/>
    <rect class="tag" x="263" y="100" width="116" height="31" rx="3"/><text class="tagtext" x="321" y="120">BOOMI</text>
    <text x="16" y="218" class="small">Manta ray · glides between familiar lanes</text><text x="16" y="237" class="small">Readable sweep warning before each pass</text>
  </g>
  <g transform="translate(886 92)">
    <rect class="card" width="408" height="250" rx="6"/><text x="16" y="28" class="label">03 · DATAWEAVE CHASM</text>
    <rect x="12" y="42" width="384" height="150" fill="#102e43"/><path d="M12 167h384v25H12z" fill="#081d27"/>
    <circle class="bubble" cx="51" cy="143" r="4"/><circle class="bubble" cx="360" cy="82" r="6"/>
    <use href="#octopus" x="102" y="53" width="166" height="132"/>
    <rect class="tag" x="252" y="100" width="127" height="31" rx="3"/><text class="tagtext" x="315" y="120">INFORMATICA</text>
    <text x="16" y="218" class="small">Octopus · tentacle pattern marks safe gaps</text><text x="16" y="237" class="small">Avoidable with the same swim + dodge controls</text>
  </g>
  <g transform="translate(26 360)">
    <rect class="card" width="408" height="250" rx="6"/><text x="16" y="28" class="label">04 · API PLATFORM</text>
    <rect x="12" y="42" width="384" height="150" fill="#10283c"/><path d="M12 167h384v25H12z" fill="#071a24"/>
    <circle class="bubble" cx="42" cy="76" r="4"/><circle class="bubble" cx="365" cy="107" r="6"/>
    <use href="#eel" x="102" y="53" width="166" height="132"/>
    <rect class="tag" x="263" y="100" width="116" height="31" rx="3"/><text class="tagtext" x="321" y="120">KONG</text>
    <text x="16" y="218" class="small">Electric eel · telegraphed horizontal dash</text><text x="16" y="237" class="small">One straight-line attack at a time</text>
  </g>
  <g transform="translate(456 360)">
    <rect class="card" width="408" height="250" rx="6"/><text x="16" y="28" class="label">05 · MULE 4 ABYSS</text>
    <rect x="12" y="42" width="384" height="150" fill="#020d1a"/><path d="M12 167h384v25H12z" fill="#07121e"/>
    <circle class="bubble" cx="59" cy="119" r="5"/><circle class="bubble" cx="356" cy="70" r="4"/>
    <use href="#puffer" x="102" y="53" width="166" height="132"/>
    <rect class="tag" x="263" y="100" width="116" height="31" rx="3"/><text class="tagtext" x="321" y="120">TIBCO</text>
    <text x="16" y="218" class="small">Pufferfish · slow, clearly telegraphed bursts</text><text x="16" y="237" class="small">Projectiles reuse the current bolt language</text>
  </g>
  <g transform="translate(886 360)">
    <rect class="card" width="408" height="250" rx="6"/><text x="16" y="28" class="label">06 · IPO CONTROL PLANE</text>
    <rect x="12" y="42" width="384" height="150" fill="#211a35"/><path d="M12 167h384v25H12z" fill="#100e20"/>
    <circle class="bubble" cx="50" cy="105" r="4"/><circle class="bubble" cx="363" cy="141" r="6"/>
    <use href="#turtle" x="102" y="53" width="166" height="132"/>
    <rect class="tag" x="263" y="100" width="116" height="31" rx="3"/><text class="tagtext" x="321" y="120">ORACLE</text>
    <text x="16" y="218" class="small">Vault turtle · guarded phases, then open target</text><text x="16" y="237" class="small">Final boss gets the same simple hit feedback</text>
  </g>

  <!-- Shared rules -->
  <g transform="translate(26 628)">
    <rect class="card" width="604" height="190" rx="6"/>
    <text x="18" y="30" fill="#f0d060" font-size="17" font-weight="bold">SHARED BOSS RULES · KEEP THE GAME FAMILIAR</text>
    <text x="20" y="62" class="small">• Same swim / flap movement; no new combat buttons.</text>
    <text x="20" y="88" class="small">• Boss appears after the level's regular hazards; 3 clear hits to win.</text>
    <text x="20" y="114" class="small">• T fires the existing squad rockets; boss has a visible 3-pip health bar.</text>
    <text x="20" y="140" class="small">• Every attack gets a brief visual warning and a safe dodge lane.</text>
    <text x="20" y="166" class="small">• Defeat opens the normal level gate; no separate arena transition.</text>
  </g>
  <g transform="translate(648 628)">
    <rect class="card" width="646" height="190" rx="6"/>
    <text x="18" y="30" fill="#f0d060" font-size="17" font-weight="bold">OPTIONAL FINAL STAGE · CRM VESTING SURGE</text>
    <rect x="18" y="47" width="272" height="112" fill="#081a28" stroke="#28556a"/>
    <path d="M27 145 64 132 91 138 120 104 148 116 184 81 214 89 274 58" fill="none" stroke="#5ee6aa" stroke-width="5"/>
    <path d="M24 151h252M25 59v92" stroke="#365264" stroke-width="2"/>
    <text x="314" y="66" class="small">Unlock only after all connectors</text>
    <text x="314" y="90" class="small">in the six regular levels are linked.</text>
    <text x="314" y="118" class="small">Endless columns accelerate over time;</text>
    <text x="314" y="142" class="small">survival seconds build a score multiplier.</text>
    <text x="314" y="166" class="small">CRM stock-chart background rises behind play.</text>
  </g>
  <text x="28" y="867" fill="#7fd7ff" font-size="16" font-weight="bold">APPROVAL CHECKPOINT</text>
  <text x="28" y="896" class="small">Please review: competitor-to-level matchups, sea-creature choices, 3-hit boss difficulty, and the shared attack style.</text>
  <text x="28" y="923" class="small">This is a concept sheet, not final production sprite art. Boss sizes, colors, and tag styling can still change.</text>
  <text x="28" y="967" fill="#9dc2d0" font-size="12">Proposal maps themes to SAP · Boomi · Informatica · Kong · TIBCO · Oracle. Brand names are text tags only; creature illustrations are original concepts.</text>
</svg>
