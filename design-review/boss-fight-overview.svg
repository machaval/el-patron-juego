<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1010" viewBox="0 0 1320 1010" role="img" aria-labelledby="title desc">
  <title id="title">Boss fight and Vesting Surge design overview</title>
  <desc id="desc">Six pixel-art sea creature boss concepts tagged with integration competitors, followed by the shared fight rules and the conditional endless bonus stage concept.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#102b38"/><stop offset="1" stop-color="#06121b"/></linearGradient>
    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#123a4a"/><stop offset="1" stop-color="#092430"/></linearGradient>
    <style>
      text { font-family: monospace; }
      .card { fill: #0b202b; stroke: #28556a; stroke-width: 2; }
      .scene { fill: url(#water); }
      .small { fill: #9dc2d0; font-size: 13px; }
      .label { fill: #cde8f5; font-size: 16px; font-weight: bold; }
      .tag { fill: #071820; stroke: #7fd7ff; stroke-width: 2; }
      .tagtext { fill: #b9efff; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .bubble { fill: #77c8d7; opacity: .45; }
    </style>
