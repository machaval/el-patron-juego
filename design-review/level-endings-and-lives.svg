<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title description">
  <title id="title">Level exit and five life HUD design proposal</title>
  <desc id="description">Six pixel-art underwater gateway concepts, each previewing the next level, plus a five-mule-head life display.</desc>
  <defs>
    <linearGradient id="page" x2="0" y2="1"><stop stop-color="#102b38"/><stop offset="1" stop-color="#06121b"/></linearGradient>
    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#154559"/><stop offset="1" stop-color="#092430"/></linearGradient>
    <symbol id="gate" viewBox="0 0 112 132">
      <rect x="9" y="2" width="94" height="128" fill="#07151f"/>
      <rect x="17" y="10" width="78" height="112" fill="#d4a017"/>
      <rect x="24" y="18" width="64" height="98" fill="#183e48"/>
      <rect x="32" y="27" width="48" height="81" fill="#061722"/>
      <rect x="39" y="34" width="34" height="66" fill="#18536a"/>
      <rect x="4" y="18" width="12" height="98" fill="#f1c85b"/>
      <rect x="96" y="18" width="12" height="98" fill="#f1c85b"/>
      <rect x="0" y="112" width="112" height="12" fill="#c28b2d"/>
      <rect x="0" y="8" width="112" height="10" fill="#f5da85"/>
      <rect x="48" y="43" width="16" height="6" fill="#d6f7e9"/>
      <rect x="43" y="53" width="26" height="6" fill="#8ee2cd"/>
      <rect x="38" y="63" width="36" height="6" fill="#d6f7e9"/>
      <rect x="43" y="73" width="26" height="6" fill="#8ee2cd"/>
      <rect x="48" y="83" width="16" height="6" fill="#d6f7e9"/>
      <rect x="21" y="20" width="5" height="88" fill="#fff1ae" opacity=".72"/>
      <rect x="86" y="20" width="5" height="88" fill="#704e21" opacity=".7"/>
      <rect x="-3" y="43" width="10" height="7" fill="#7fd7ff"/>
      <rect x="105" y="77" width="10" height="7" fill="#7fd7ff"/>
    </symbol>
    <symbol id="vault" viewBox="0 0 132 132">
      <rect x="5" y="4" width="122" height="124" fill="#07131b"/>
      <rect x="12" y="10" width="108" height="111" fill="#9c7024"/>
      <rect x="20" y="18" width="92" height="96" fill="#f0c44f"/>
      <rect x="28" y="26" width="76" height="80" fill="#513e22"/>
      <rect x="36" y="34" width="60" height="64" fill="#0b2027"/>
      <rect x="45" y="42" width="42" height="48" fill="#153d44"/>
      <rect x="62" y="47" width="8" height="38" fill="#f6d36f"/>
      <rect x="48" y="62" width="36" height="8" fill="#f6d36f"/>
      <rect x="60" y="57" width="12" height="18" fill="#f6d36f"/>
      <rect x="14" y="116" width="104" height="8" fill="#fff0ae"/>
      <rect x="3" y="19" width="10" height="94" fill="#e1ad39"/>
      <rect x="119" y="19" width="10" height="94" fill="#e1ad39"/>
    </symbol>
    <symbol id="swimmer" viewBox="0 0 54 42">
      <rect x="3" y="15" width="37" height="17" fill="#d59a25"/>
      <rect x="13" y="9" width="23" height="8" fill="#f0c457"/>
      <rect x="36" y="11" width="13" height="13" fill="#f0c457"/>
      <rect x="43" y="14" width="7" height="4" fill="#10232b"/>
      <rect x="10" y="30" width="18" height="5" fill="#a66b1f"/>
      <rect x="16" y="18" width="4" height="4" fill="#fff1b8"/>
      <rect x="2" y="18" width="6" height="7" fill="#7fd7ff"/>
    </symbol>
    <symbol id="mule" viewBox="0 0 40 40">
      <image href="../assets/ui/mule-life.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/>
    </symbol>
    <style>
      text { font-family: monospace; }
      .card { fill: #0b202b; stroke: #28556a; stroke-width: 2; }
      .label { fill: #cde8f5; font-size: 14px; font-weight: bold; }
      .small { fill: #9dc2d0; font-size: 11px; }
      .scene { fill: url(#water); }
    </style>
  </defs>
  <rect width="1200" height="850" fill="url(#page)"/>
  <text x="28" y="38" fill="#f0d060" font-size="22" font-weight="bold">DESTINATION GATES + FIVE-LIFE HUD</text>
  <text x="29" y="62" class="small">Proposal for review · each exit previews the next level · pixel-art framing follows the current game palette</text>

  <!-- Scene card 1 -->
  <g transform="translate(24 82)">
    <rect class="card" width="374" height="246" rx="5"/>
    <text x="12" y="22" class="label">SAP TERRITORY → ANYPOINT STUDIO</text>
    <rect x="10" y="32" width="354" height="166" class="scene"/>
    <rect x="10" y="169" width="354" height="29" fill="#08251f"/>
    <path d="M10 168h48l15-18 24 18h49l18-24 23 24h47l16-19 24 19h90v30H10z" fill="#164548"/>
    <use href="#swimmer" x="38" y="117" width="54" height="42"/>
    <use href="#gate" x="242" y="56" width="103" height="130"/>
    <rect x="251" y="101" width="85" height="30" fill="#082631"/>
    <text x="293" y="113" fill="#b9efff" font-size="7" text-anchor="middle">ANYPOINT</text>
    <text x="293" y="123" fill="#b9efff" font-size="7" text-anchor="middle">STUDIO</text>
    <text x="12" y="221" class="small">Blue connector gate · warm SAP stone frame</text>
  </g>

  <!-- Scene card 2 -->
  <g transform="translate(413 82)">
    <rect class="card" width="374" height="246" rx="5"/>
    <text x="12" y="22" class="label">ANYPOINT STUDIO → DATAWEAVE CHASM</text>
    <rect x="10" y="32" width="354" height="166" fill="#102b42"/>
    <rect x="10" y="169" width="354" height="29" fill="#081b2b"/>
    <path d="M10 168h46l23-26 20 26h53l18-19 28 19h42l21-26 21 26h102v30H10z" fill="#234359"/>
    <use href="#swimmer" x="38" y="117" width="54" height="42"/>
    <use href="#gate" x="242" y="56" width="103" height="130"/>
    <rect x="251" y="101" width="85" height="30" fill="#082631"/>
    <text x="293" y="113" fill="#b9efff" font-size="7" text-anchor="middle">DATAWEAVE</text>
    <text x="293" y="123" fill="#b9efff" font-size="7" text-anchor="middle">CHASM</text>
    <text x="12" y="221" class="small">Deep blue portal · woven pixel glyphs inside</text>
  </g>

  <!-- Scene card 3 -->
  <g transform="translate(802 82)">
    <rect class="card" width="374" height="246" rx="5"/>
    <text x="12" y="22" class="label">DATAWEAVE CHASM → API PLATFORM</text>
    <rect x="10" y="32" width="354" height="166" fill="#102e43"/>
    <rect x="10" y="169" width="354" height="29" fill="#081d27"/>
    <path d="M10 168h53l14-20 26 20h42l20-29 23 29h51l21-23 18 23h86v30H10z" fill="#23515b"/>
    <use href="#swimmer" x="38" y="117" width="54" height="42"/>
    <use href="#gate" x="242" y="56" width="103" height="130"/>
    <rect x="251" y="101" width="85" height="30" fill="#082631"/>
    <text x="293" y="113" fill="#b9efff" font-size="7" text-anchor="middle">API</text>
    <text x="293" y="123" fill="#b9efff" font-size="7" text-anchor="middle">PLATFORM</text>
    <text x="12" y="221" class="small">Cyan gateway · flowing request-arrow motif</text>
  </g>

  <!-- Scene card 4 -->
  <g transform="translate(24 342)">
    <rect class="card" width="374" height="246" rx="5"/>
    <text x="12" y="22" class="label">API PLATFORM → MULE 4 ABYSS</text>
    <rect x="10" y="32" width="354" height="166" fill="#10283c"/>
    <rect x="10" y="169" width="354" height="29" fill="#071a24"/>
    <path d="M10 168h48l18-20 19 20h55l21-28 24 28h49l18-22 25 22h97v30H10z" fill="#244b5b"/>
    <use href="#swimmer" x="38" y="117" width="54" height="42"/>
    <use href="#gate" x="242" y="56" width="103" height="130"/>
    <rect x="251" y="101" width="85" height="30" fill="#082631"/>
    <text x="293" y="113" fill="#b9efff" font-size="7" text-anchor="middle">MULE 4</text>
    <text x="293" y="123" fill="#b9efff" font-size="7" text-anchor="middle">ABYSS</text>
    <text x="12" y="221" class="small">Steel-blue frame · pressure bands and mule crest</text>
  </g>

  <!-- Scene card 5 -->
  <g transform="translate(413 342)">
    <rect class="card" width="374" height="246" rx="5"/>
    <text x="12" y="22" class="label">MULE 4 ABYSS → IPO CONTROL PLANE</text>
    <rect x="10" y="32" width="354" height="166" fill="#211a35"/>
    <rect x="10" y="169" width="354" height="29" fill="#100e20"/>
    <path d="M10 168h52l18-22 23 22h44l21-27 24 27h52l17-19 25 19h98v30H10z" fill="#3b2947"/>
    <use href="#swimmer" x="38" y="117" width="54" height="42"/>
    <use href="#gate" x="242" y="56" width="103" height="130"/>
    <rect x="251" y="101" width="85" height="30" fill="#251a36"/>
    <text x="293" y="113" fill="#ffe49a" font-size="7" text-anchor="middle">IPO</text>
    <text x="293" y="123" fill="#ffe49a" font-size="7" text-anchor="middle">CONTROL PLANE</text>
    <text x="12" y="221" class="small">Violet-and-gold gate · brighter endgame lighting</text>
  </g>

  <!-- Final card -->
  <g transform="translate(802 342)">
    <rect class="card" width="374" height="246" rx="5"/>
    <text x="12" y="22" class="label">IPO CONTROL PLANE → FINAL CASH-OUT</text>
    <rect x="10" y="32" width="354" height="166" fill="#281e3d"/>
    <rect x="10" y="169" width="354" height="29" fill="#120f22"/>
    <path d="M10 168h54l17-24 21 24h47l20-27 22 27h51l18-22 24 22h97v30H10z" fill="#49304e"/>
    <use href="#swimmer" x="35" y="117" width="54" height="42"/>
    <use href="#vault" x="236" y="54" width="118" height="132"/>
    <text x="295" y="153" fill="#ffe49a" font-size="8" font-weight="bold" text-anchor="middle">CASH OUT</text>
    <text x="12" y="221" class="small">Vault door finale · distinct from ordinary level gates</text>
  </g>

  <!-- Shared five-life HUD proposal -->
  <g transform="translate(24 610)">
    <rect class="card" width="1152" height="208" rx="5"/>
    <text x="18" y="29" fill="#f0d060" font-size="16" font-weight="bold">HUD PROPOSAL · FIVE MULE-HEAD LIVES</text>
    <text x="18" y="52" class="small">Plain single-blue mule-head silhouettes; bright = remaining life, dim = lost life.</text>
    <rect x="18" y="70" width="1116" height="74" rx="3" fill="#071820" stroke="#28556a"/>
    <text x="35" y="99" fill="#f0d060" font-size="12" font-weight="bold">VESTED $001204</text>
    <text x="314" y="99" fill="#7fd7ff" font-size="12" font-weight="bold">L3 DATAWEAVE CHASM</text>
    <text x="723" y="99" fill="#a9d8df" font-size="12" font-weight="bold">LIVES</text>
    <g transform="translate(775 79)"><use href="#mule" width="38" height="38"/></g>
    <g transform="translate(819 79)"><use href="#mule" width="38" height="38"/></g>
    <g transform="translate(863 79)"><use href="#mule" width="38" height="38"/></g>
    <g transform="translate(907 79)"><use href="#mule" width="38" height="38"/></g>
    <g transform="translate(951 79)"><use href="#mule" width="38" height="38"/></g>
    <text x="1010" y="101" fill="#9dc2d0" font-size="10">5 / 5</text>
    <text x="18" y="174" class="small">Approval questions: are the destinations recognizable and large enough? Does this mule-head icon read clearly at HUD size? Should any level gate or icon detail change?</text>
  </g>
</svg>
