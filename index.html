<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Patrón · The Vesting Horizon</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="frame">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="scanlines"></div>
  </div>
  <div id="controls" aria-label="Game controls">
    <button id="flap-button" type="button" aria-label="Flap">FLAP</button>
    <button id="shout-button" type="button" aria-label="Use Trabajeen">TRABAJEEEN</button>
    <button id="pause-button" type="button" aria-label="Pause game">PAUSE</button>
    <button id="mute-button" type="button" aria-label="Mute sound">MUTE</button>
  </div>
  <p id="hint">SPACE / CLICK flap · T Trabajeen! · P pause · M mute · ENTER start</p>
  <script src="game.js"></script>
</body>
</html>
